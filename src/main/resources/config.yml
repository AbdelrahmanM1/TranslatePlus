# TranslatePlus Configuration File v1.1
#
# Translation Service Configuration
# Choose between 'google' or 'openai' as your translation provider
translation-service: "google"

# Google Translate API Configuration
# Get your Google Translate API key from:
# https://cloud.google.com/translate/docs/setup
google-api-key: "PUT-YOUR-GOOGLE-KEY-HERE"

# OpenAI API Configuration
# Get your OpenAI API key from:
# https://platform.openai.com/account/api-keys
openai-api-key: "PUT-YOUR-OPENAI-KEY-HERE"

# Default target language for new users
# Use ISO 639-1 language codes (en, es, fr, de, etc.)
# Full list available with /translate list command
default-language: "en"

# Whether to translate player commands (experimental feature)
# Warning: This may cause performance issues on busy servers
# and may translate commands that shouldn't be translated
translate-commands: false

# Enable debug logging for troubleshooting
# This will log detailed information about translations
debug-mode: false

# Plugin messages (supports color codes with &)
# Available placeholders: %lang%, %status%, %player%, %service%
messages:
  prefix: "&7[&aTranslatePlus&7] "
  enabled: "&aTranslation enabled! Target language: %lang% (via %service%)"
  disabled: "&cTranslation disabled!"
  status: "&eYour translation is %status% (Language: %lang%, Service: %service%)"
  no-api-key: "&cTranslation API key not set in config!"
  reload: "&aTranslatePlus config reloaded successfully."
  default-set: "&aDefault language set to %lang%."
  invalid-language: "&cInvalid language code: %lang%. Use /translate list to see available languages."
  translation-error: "&cTranslation error occurred! Check console for details."
  no-permission: "&cYou don't have permission to use this command!"
  usage: "&eUsage: /translate <on|off|status|help|list|reload|setdefault|service>"
  api-quota-exceeded: "&cAPI quota exceeded! Please try again later."
  player-only: "&cThis command can only be used by players!"
  already-enabled: "&eTranslation is already enabled for %lang%!"
  already-disabled: "&eTranslation is already disabled!"
  same-language: "&eMessage is already in your target language!"
  translation-timeout: "&cTranslation request timed out. Please try again."
  rate-limit-exceeded: "&cYou are sending messages too quickly! Please slow down."
  service-changed: "&aTranslation service changed to %service%!"
  service-status: "&eCurrent translation service: %service%"

# Advanced Settings
# Only modify these if you know what you're doing
advanced:
  # Maximum number of cached translations to store in memory
  # Higher values use more RAM but reduce API calls
  cache-size: 1000

  # Connection timeout for API requests (milliseconds)
  # How long to wait when connecting to translation API
  connection-timeout: 5000

  # Read timeout for API requests (milliseconds)
  # How long to wait for API response
  read-timeout: 10000

  # Maximum message length to translate (characters)
  # Longer messages will be truncated to prevent API errors
  max-message-length: 500

  # Minimum message length to translate (characters)
  # Very short messages like "ok", "hi" won't be translated
  min-message-length: 2

  # Rate limiting - maximum translations per player per minute
  # Set to 0 to disable rate limiting
  rate-limit-per-minute: 30

  # Whether to translate messages that appear to already be in English
  # This uses basic heuristics to detect English text
  translate-english-text: true

  # Cache cleanup interval in minutes
  # How often to clean up old cache entries
  cache-cleanup-interval: 60

# Service-specific settings
service-settings:
  google:
    # Google Translate specific settings
    use-base-model: true
    format: "text"

  openai:
    # OpenAI specific settings
    model: "gpt-3.5-turbo"  # Options: gpt-3.5-turbo, gpt-4 (more expensive)
    max-tokens: 150
    temperature: 0.1  # Low temperature for consistent translations

# Performance optimization settings
performance:
  # Enable asynchronous translation processing
  # Improves server performance by not blocking main thread
  async-translation: true

  # Enable batch translation processing
  # Groups multiple translations together for efficiency
  batch-translations: true

  # Maximum number of concurrent translation requests
  # Higher values may improve throughput but use more resources
  max-concurrent-translations: 10

# Blacklisted words/phrases that should never be translated
# Use lowercase entries - matching is case-insensitive
# These are typically server-related terms that should remain in English
translation-blacklist:
  - "server"
  - "minecraft"
  - "bukkit"
  - "spigot"
  - "paper"
  - "plugin"
  - "mod"
  - "admin"
  - "op"
  - "operator"
  - "whitelist"
  - "ban"
  - "kick"
  - "mute"
  - "tempban"
  - "unban"
  - "unmute"
  - "gamemode"
  - "creative"
  - "survival"
  - "spectator"
  - "adventure"

# Language-specific settings
language-settings:
  # These languages require special handling
  special-handling:
    # Right-to-left languages
    # These languages will display special RTL formatting
    rtl-languages:
      - "ar"  # Arabic
      - "he"  # Hebrew
      - "fa"  # Persian/Farsi
      - "ur"  # Urdu
      - "ps"  # Pashto
      - "sd"  # Sindhi

    # Languages that typically require more characters
    # These may need special consideration for message length
    verbose-languages:
      - "de"  # German
      - "fi"  # Finnish
      - "hu"  # Hungarian
      - "ja"  # Japanese
      - "ko"  # Korean
      - "th"  # Thai
      - "vi"  # Vietnamese