name: TranslatePlus
version: '1.1'
main: dev.abdelrahman.translatePlus.TranslatePlus
api-version: '1.13'
authors: [ 3bdoabk ]
description: 'Real-time chat translation using Google Translate API'
website: 'https://github.com/AbdelrahmanM1'

commands:
  translate:
    description: 'Main translation command'
    usage: '/<command> <on [language]|off|status|help|list|reload|setdefault [language]>'
    aliases: [ 'tr' ]
    permission: 'translateplus.use'
    permission-message: '&cYou don''t have permission to use translation commands!'

permissions:
  translateplus.use:
    description: 'Basic translation commands'
    default: true

  translateplus.admin:
    description: 'Admin commands (reload, setdefault)'
    default: op
    children:
      translateplus.use: true

  translateplus.*:
    description: 'All TranslatePlus permissions'
    default: false
    children:
      translateplus.admin: true